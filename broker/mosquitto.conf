# LoRaMesh Monitor — local Mosquitto configuration
#
# Listener 1883: MQTT over TCP, used by the Heltec firmware.
# Listener 9001: MQTT over WebSocket, used by the browser dashboard.
#
# This configuration allows anonymous access for lab use. See README.md
# before exposing the broker outside a trusted network.

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# --- Firmware: plain MQTT over TCP -----------------------------------------
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# --- Dashboard: MQTT over WebSocket ----------------------------------------
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
